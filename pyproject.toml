[project]
name = "broll-prepass"
version = "0.1.0"
description = "B-Roll Pre-Pass: batch tool that turns a script into a reviewable set of license-cleared image/video candidates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "typer>=0.12",
    "Pillow>=10.2",
    "ImageHash>=4.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# CLIP rerank is heavy (torch); install only when you want stage [5] reranking.
clip = [
    "open-clip-torch>=2.24",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
broll = "broll.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["broll"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
